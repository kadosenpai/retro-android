name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mgba_ref:
        description: "Nhánh/tag/commit của mGBA (mặc định 0.10.5)"
        required: false
        default: "0.10.5"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: "27.1.12297006"
      MGBA_REF: ${{ github.event.inputs.mgba_ref || '0.10.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài SDK/NDK/CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          sudo apt-get update -y && sudo apt-get install -y ninja-build

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build lõi mGBA cho Android
        run: ./scripts/build-mgba-android.sh

      - name: Chuẩn bị khoá ký
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/retro.jks"
            echo "RETRO_KEYSTORE_FILE=$RUNNER_TEMP/retro.jks" >> "$GITHUB_ENV"
            echo "Dùng khoá ký riêng."
          else
            echo "Chưa có secret KEYSTORE_BASE64, ký bằng khoá debug."
          fi

      - name: Build APK
        env:
          RETRO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RETRO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RETRO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Kiểm tra chữ ký
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | head -5

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Retro.apk
          cp app/src/main/mgba-commit.txt out/mgba-commit.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: Retro-apk
          path: out/
          if-no-files-found: error
